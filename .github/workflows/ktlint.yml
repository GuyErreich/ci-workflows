name: ktlint
on:
  workflow_call:
    inputs:
      java-version: { type: string, default: "17" }
permissions: {}
jobs:
  ktlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "${{ inputs.java-version }}" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
      # Expects the org.jlleitschuh.gradle.ktlint plugin in the caller.
      - run: ./gradlew ktlintCheck --no-daemon
