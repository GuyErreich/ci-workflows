name: Android lint
on:
  workflow_call:
    inputs:
      java-version: { type: string, default: "17" }
      lint-task: { type: string, default: "lint" }
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "${{ inputs.java-version }}" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
      # Fails on errors; existing warnings live in the caller's lint-baseline.xml
      # (set lint { baseline = file("lint-baseline.xml"); abortOnError = true } in the app module).
      - env:
          LINT_TASK: ${{ inputs.lint-task }}
        run: ./gradlew "$LINT_TASK" --no-daemon
