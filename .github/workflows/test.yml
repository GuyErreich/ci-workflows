# Reusable workflow: Android unit tests (JVM + Robolectric) with reports.
# Owner: Gali (QA). Called from Backpin, pinned to a ci-workflows commit SHA.
name: test

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK version used to build and test.
        type: string
        default: "17"
      gradle-task:
        description: Gradle task that runs the unit tests (Robolectric included).
        type: string
        default: testDebugUnitTest
      working-directory:
        type: string
        default: .

permissions: {}

jobs:
  unit-tests:
    name: Unit tests (Robolectric)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      - name: Run unit tests
        env:
          GRADLE_TASK: ${{ inputs.gradle-task }}
        run: ./gradlew "$GRADLE_TASK" --continue --stacktrace

      # Summary + inline failure annotations only: no check runs, no PR comments,
      # so the job needs no write permissions.
      - name: Test summary
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: "**/build/test-results/**/TEST-*.xml"
          annotate_only: true
          detailed_summary: true
          include_passed: false
          require_tests: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
